<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .table-responsive {
        max-height: 80vh;
        overflow-y: auto;
      }
      .sticky-header th {
        position: sticky;
        top: 0;
        background-color: #f8f9fa;
        z-index: 1;
      }
      .total-row {
        font-weight: bold;
        background-color: #e9ecef;
      } /* Study Status Button */
      .study-status {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border: 2px solid #dc3545;
        background-color: #fff;
        color: #dc3545;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      } /* Studied */
      .study-status.done {
        background-color: #198754;
        border-color: #198754;
        color: white;
      }
      .study-status:hover {
        transform: scale(1.08);
      } /* Hide actual checkbox */
      .hidden-checkbox {
        display: none;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>&lt; {{ goal.title }} &gt;</h2>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
          Back to Dashboard
        </a>
      </div>
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-bordered align-middle text-center">
              <thead class="sticky-header">
                <tr>
                  <th>Morning</th>
                  <th>Hours</th>
                  <th>Evening</th>
                  <th>Hours</th>
                  <th>Date</th>
                  <th>GitHub</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                {% for log in logs %}
                <tr>
                  <form action="{% url 'track_log' log.id %}" method="POST">
                    {% csrf_token %}
                    <!-- MORNING -->
                    <td>
                      <input
                        type="checkbox"
                        name="morning_done"
                        id="morning_{{ log.id }}"
                        class="hidden-checkbox"
                        {%
                        if
                        log.morning_done
                        %}checked{%
                        endif
                        %}
                      />
                      <label
                        for="morning_{{ log.id }}"
                        class="study-status {% if log.morning_done %}done{% endif %}"
                        onclick="toggleStatus(this)"
                      >
                        {% if log.morning_done %} ✓ {% else %} ✗ {% endif %}
                      </label>
                    </td>
                    <!-- MORNING HOURS -->
                    <td>
                      <input
                        type="number"
                        step="0.5"
                        min="0"
                        name="morning_hours"
                        value="{{ log.morning_hours }}"
                        class="form-control text-center"
                        style="width: 80px; margin: auto"
                      />
                    </td>
                    <!-- EVENING -->
                    <td>
                      <input
                        type="checkbox"
                        name="evening_done"
                        id="evening_{{ log.id }}"
                        class="hidden-checkbox"
                        {%
                        if
                        log.evening_done
                        %}checked{%
                        endif
                        %}
                      />
                      <label
                        for="evening_{{ log.id }}"
                        class="study-status {% if log.evening_done %}done{% endif %}"
                        onclick="toggleStatus(this)"
                      >
                        {% if log.evening_done %} ✓ {% else %} ✗ {% endif %}
                      </label>
                    </td>
                    <!-- EVENING HOURS -->
                    <td>
                      <input
                        type="number"
                        step="0.5"
                        min="0"
                        name="evening_hours"
                        value="{{ log.evening_hours }}"
                        class="form-control text-center"
                        style="width: 80px; margin: auto"
                      />
                    </td>
                    <!-- DATE -->
                    <td><strong> {{ log.date|date:"d-m-Y" }} </strong></td>
                    <!-- GITHUB -->
                    <td>
                      <div class="input-group">
                        <div class="input-group-text">
                          <input
                            type="checkbox"
                            name="github_pushed"
                            class="form-check-input mt-0"
                            {%
                            if
                            log.github_pushed
                            %}checked{%
                            endif
                            %}
                          />
                        </div>
                        <input
                          type="url"
                          name="github_link"
                          value="{{ log.github_link|default:'' }}"
                          class="form-control"
                          placeholder="Commit URL"
                        />
                      </div>
                    </td>
                    <!-- SAVE -->
                    <td>
                      <button type="submit" class="btn btn-sm btn-primary">
                        Save
                      </button>
                    </td>
                  </form>
                </tr>
                {% endfor %}
              </tbody>
              <!-- TOTAL -->
              <tfoot>
                <tr class="total-row">
                  <td colspan="4" class="text-end">
                    <strong>Total Hours =</strong>
                  </td>
                  <td colspan="3" class="text-start">
                    <span class="badge bg-success fs-6">
                      {{ goal.total_hours }} Hours
                    </span>
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </div>
    </div>
    <script>
      function toggleStatus(button) {
        const checkbox = document.getElementById(button.getAttribute("for"));
        checkbox.checked = !checkbox.checked;
        if (checkbox.checked) {
          button.classList.add("done");
          button.innerHTML = "✓";
        } else {
          button.classList.remove("done");
          button.innerHTML = "✗";
        }
      }
    </script>
  </body>
</html>
