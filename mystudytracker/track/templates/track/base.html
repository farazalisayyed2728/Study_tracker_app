{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090d18" />
    <title>{% block title %}Study Space{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <nav class="topbar">
      <a class="brand" href="{% url 'dashboard' %}">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>Study<span class="brand-accent">space</span></span>
      </a>
      {% if request.user.is_authenticated %}
      <div class="topbar-actions">
        <span class="welcome-label">Hi, {{ request.user.username }}</span>
        <form action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button class="quiet-button" type="submit">Sign out</button>
        </form>
      </div>
      {% endif %}
    </nav>
    <main class="page-shell">
      {% if messages %}
      <div class="message-stack" aria-live="polite">
        {% for message in messages %}
        <div class="glass-message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
