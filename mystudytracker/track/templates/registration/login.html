{% extends "track/base.html" %}
{% block title %}Sign in · Studyspace{% endblock %}

{% block content %}
<section class="login-layout">
  <div class="login-panel">
    <div class="login-icon" aria-hidden="true">S</div>
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Return to your<br /><span>focus space.</span></h1>
    {% if form.errors %}<div class="field-errors">Your username and password didn't match. Please try again.</div>{% endif %}
    <form method="post" class="goal-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}" />
      <div class="form-field">
        <label for="id_username">Username</label>
        <input id="id_username" type="text" name="username" class="form-control" autocomplete="username" required autofocus />
      </div>
      <div class="form-field">
        <label for="id_password">Password</label>
        <input id="id_password" type="password" name="password" class="form-control" autocomplete="current-password" required />
      </div>
      <button type="submit" class="primary-button">Sign in <span aria-hidden="true">↗</span></button>
    </form>
  </div>
</section>
{% endblock %}
