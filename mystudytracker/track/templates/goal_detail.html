<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&lt; {{ goal.title }} &gt;</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-responsive { max-height: 80vh; overflow-y: auto; }
        .sticky-header th { position: sticky; top: 0; background-color: #f8f9fa; z-index: 1; }
        .total-row { font-weight: bold; background-color: #e9ecef; }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>&lt; {{ goal.title }} &gt;</h2>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Back to Dashboard</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered align-middle text-center">
                    <thead class="sticky-header">
                        <tr>
                            <th scope="col">Morning</th>
                            <th scope="col">Hours</th>
                            <th scope="col">Evening</th>
                            <th scope="col">Hours</th>
                            <th scope="col">Date</th>
                            <th scope="col">GitHub</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for log in logs %}
                        <tr>
                            <form action="{% url 'update_log' log.id %}" method="POST">
                                {% csrf_token %}
                                <td>
                                    <input type="checkbox" name="morning_done" class="form-check-input" {% if log.morning_done %}checked{% endif %}>
                                </td>
                                <td>
                                    <input type="number" step="0.5" name="morning_hours" value="{{ log.morning_hours }}" class="form-control text-center" style="width: 80px; margin: auto;">
                                </td>
                                <td>
                                    <input type="checkbox" name="evening_done" class="form-check-input" {% if log.evening_done %}checked{% endif %}>
                                </td>
                                <td>
                                    <input type="number" step="0.5" name="evening_hours" value="{{ log.evening_hours }}" class="form-control text-center" style="width: 80px; margin: auto;">
                                </td>
                                <td><strong>{{ log.date|date:"d-m-Y" }}</strong></td>
                                <td>
                                    <div class="input-group">
                                        <div class="input-group-text">
                                            <input type="checkbox" name="github_pushed" class="form-check-input mt-0" {% if log.github_pushed %}checked{% endif %}>
                                        </div>
                                        <input type="url" name="github_link" value="{{ log.github_link|default:'' }}" class="form-control" placeholder="Commit URL">
                                    </div>
                                </td>
                                <td>
                                    <button type="submit" class="btn btn-sm btn-primary">Save</button>
                                </td>
                            </form>
                        </tr>
                        {% endfor %}
                    </tbody>
                    <tfoot>
                        <tr class="total-row">
                            <td colspan="4" class="text-end"><strong>Total Hours =</strong></td>
                            <td colspan="3" class="text-start"><span class="badge bg-success fs-6">{{ goal.total_hours }} Hours</span></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
